help.private.hello=*Hello, meatbag!*\n\nI am designed to work in group chats, but you can also use me in private messages.\n\nIn that case, keep in mind that I won''t be able to perform some functions that are only available in group chats. See you around!
help.group.hello=*Hello, meatbag!*\n\nI can help you with a few things:\n- Queue management\n- Timetable management\n- Task management\n- Respect management\n- Some fun\n\nTo learn more, use this command in a PM with me\nIf you prefer another approach, check out the website guide
help.online_help=\uD83C\uDF10 Online Guide
help.short_help=\uD83D\uDCBB Short Guide
help.full_guide=*ALL ABOUT QUEUES*\n/queue <Name> - Create a queue with the given name\n/mixed <Name> - Create a mixed queue with the given name\n\nFurther interaction with queues is done by pressing the corresponding buttons under the bot message:\n- Join \uD83D\uDD30 - Join at the end of the queue\n- I''m done ✅ - Leave the queue and notify the next person\n- Leave \ud83d\udd04 - Leave not from the head of the queue, without notification\n- Delete ❌ - Delete the queue, admin only\n- Notify ⚠ - Notify the head of the queue about their position\n- Shuffle \uD83D\uDD00 - Shuffle the queue in a random order\n\n*ALL ABOUT RESPECT*\n/stats - View general respect statistics in this chat\n/me - View your own respect statistics in this chat\n\nRespect changes via reactions to other users'' messages, each reaction having its own positive or negative respect value. Almost all standard Telegram reactions and any custom ones are supported.\n\n*ALL ABOUT TIMETABLE*\n/editor - Generate a link to the web editor\n/today - View today''s timetable\n/tomorrow - View tomorrow''s timetable\n/week - View weekly timetable\n/now - Link to the current class\n/next - Link to the next class\n\n*ALL ABOUT TASKS*\n/task \\[dd.mm.year] \\[HH:mm] \\[Title] <Link> - Create\n/edit \\[ID] \\[dd.mm.year] \\[HH:mm] \\[Title] <Link> - Edit\n/due- List of all tasks\n\n*ABOUT ARGUMENTS*\n<Argument> and \\[Argument] differ. What''s the difference? \\[Argument] is mandatory, <Argument> - optional

