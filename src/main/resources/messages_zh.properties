help.private.hello=*你好，人类！*\n\n我是为群聊设计的，但你也可以在私聊中使用我。\n\n在这种情况下，请注意我将无法执行某些仅在群聊中可用的功能。再见！
help.group.hello=*你好，人类！*\n\n我可以帮你做以下几件事：\n- 队列管理\n- 课表管理\n- 任务管理\n- 敬意管理\n- 一些娱乐功能\n\n想了解更多，请在与我的私聊中发送此命令。\n如果你喜欢其他方式，可以查看网站指南。
help.online_help=🌐 在线指南
help.short_help=💻 简明指南
help.full_guide=*关于队列*\n/queue <名称> - 创建指定名称的队列\n/mixed <名称> - 创建指定名称的混合队列\n\n与队列的后续交互通过点击机器人消息下方的相应按钮进行：\n- Join 🔰 - 加入队列末尾\n- I''m done ✅ - 退出队列，并通知下一个人\n- Leave 🔄 - 退出队列（非队首），不发送通知\n- Delete ❌ - 删除队列（仅限管理员）\n- Notify ⚠️ - 通知队首其当前位置\n- Shuffle 🔀 - 随机打乱队列\n\n*关于敬意*\n/stats - 查看此群聊的敬意统计数据\n/me - 查看您在此群聊的敬意统计数据\n\n敬意值通过对其他用户消息的反应（Reactions）来改变，每种反应都有其正向或负向的敬意值。支持几乎所有标准 Telegram 反应和任何自定义反应。\n\n*关于课表*\n/editor - 生成网页编辑器的链接\n/today - 查看今天的课表\n/tomorrow - 查看明天的课表\n/week - 查看本周课表\n/now - 当前课程的链接\n/next - 下一节课程的链接\n\n*关于任务*\n/task \\[dd.mm.year] \\[HH:mm] \\[标题] <链接> - 创建任务\n/edit \\[ID] \\[dd.mm.year] \\[HH:mm] \\[标题] <链接> - 编辑任务\n/due - 列出所有任务\n\n*关于参数*\n<参数> 和 \\[参数] 不同。有什么区别？\\[参数] 是必填的，而 <参数> 是可选的。

