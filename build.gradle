plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.springframework.boot' version '3.5.6'
}

group = 'dev.ua.ikeepcalm'
version = '2.0.1'
description = 'lumios.dev backend application'

String springVersion = '3.5.6'
String telegramApiVersion = '9.0.0'
String lombokVersion = '1.18.42'

java {
    compileJava.options.release = 25
    compileTestJava.options.release = 25
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
}

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:$springVersion")

    implementation 'com.mysql:mysql-connector-j:9.1.0'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.1'

    implementation "org.springframework.boot:spring-boot-starter-data-jpa:$springVersion"
    implementation "org.springframework.boot:spring-boot-starter-web:$springVersion"
    implementation "org.springframework.boot:spring-boot-starter-security:$springVersion"

    implementation "org.telegram:telegrambots-longpolling:$telegramApiVersion"
    implementation "org.telegram:telegrambots-client:$telegramApiVersion"
    implementation("com.github.ben-manes.caffeine:caffeine:3.1.8")

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'

    implementation 'org.json:json:20250107'
    implementation 'io.github.sashirestela:simple-openai:3.8.2'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.liquibase:liquibase-core'

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"

    testImplementation "org.springframework.boot:spring-boot-starter-test:$springVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
